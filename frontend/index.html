<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Static fallback metadata. Per-route titles, descriptions, canonicals and
    JSON-LD are written at runtime by src/components/seo/Seo.jsx; these values
    are what non-JS link unfurlers and the very first paint see.
  -->
  <title>Vegan Life | Learn, Explore &amp; Live Vegan</title>
  <meta name="description" content="Vegan Life is a community platform for learning what veganism means, exploring practical resources, and connecting with people moving toward more compassionate, sustainable living." />
  <meta name="theme-color" content="#573d21" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://vegan-life.vercel.app/" />

  <meta property="og:site_name" content="Vegan Life" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="Vegan Life | Learn, Explore &amp; Live Vegan" />
  <meta property="og:description" content="Learn about veganism, explore practical resources, and connect with a community exploring compassionate living." />
  <meta property="og:url" content="https://vegan-life.vercel.app/" />
  <meta property="og:image" content="https://vegan-life.vercel.app/icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Vegan Life | Learn, Explore &amp; Live Vegan" />
  <meta name="twitter:description" content="Learn about veganism, explore practical resources, and connect with a community exploring compassionate living." />
  <meta name="twitter:image" content="https://vegan-life.vercel.app/icon-512.png" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!--
    Fonts are loaded once, here. global.css used to @import the same two
    families, which serialised a second stylesheet request behind the CSS
    parse. `display=swap` keeps text visible while they download.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
  />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
